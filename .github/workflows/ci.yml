name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: CLI smoke test
        shell: bash
        run: |
          flagpole --version
          flagpole --db ci.db flags create ci-check --description "created in CI"
          flagpole --db ci.db flags enable ci-check
          flagpole --db ci.db eval ci-check --context '{"key": "u1"}'
